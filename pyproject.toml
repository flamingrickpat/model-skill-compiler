[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-skill-compiler"
version = "0.1.0"
description = "Model-specific progressive compression of coding-agent Markdown skills via llama.cpp."
requires-python = ">=3.11"
dependencies = [
  "requests",
  "rich",
  "markdown-it-py",
  "mdit-py-plugins",
  "blingfire",
  "yake",
  "json-repair",
  "python-frontmatter",
]

[project.scripts]
skill-compiler = "skill_compiler:main"

[tool.setuptools]
py-modules = ["skill_compiler"]
